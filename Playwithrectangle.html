<!DOCTYPE html>
<html>
    <head>
        <title>Playing with a Rectangle</title>
        <style>
            h2 {
                text-align: center;

            }
            .rectangle {
                border: 1px solid black;
                width: 400px;
                height: 200px;
                margin: auto;
            }
            .buttons {
                padding: 20px;
                width: 200px;
                margin: auto;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h2>Make changes into a rectangle</h2>
        <div class="rectangle"></div>
        <div class="buttons">
        <button onclick="makeACircle()">Make a circle</button>
        <button onclick="hideRect()">Hide</button>
        <button onclick="showRect()">Show</button>
        </div>
        <script>
        let div = document.querySelector(`.rectangle`);
        function makeACircle() {
            div.style.borderRadius = `50%`;

        }
        function hideRect() {
            div.style.display = `none`;

        }
        function showRect() {
            div.style.display = `block`;
        }
        div.onmouseenter = function() {
            div.style.background = `lightblue`;

        }
        div.onmouseleave = function() {
            div.style.background = `lightgreen`;
        }
        </script>
    </body>
</html>
