<DOCTYPE html>
    <html>
        <head>
            <title>Hobby Cards</title>
            <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
            <style>
                body {
                    background-color: #f9f9f9;
                    font-family: Arial, Helvetica, sans-serif;
                    padding: 30px 15px;

                }
                h1 {
                    text-align: center;
                    color: #ff5843;

                }
                .hobby-card {
                    text-align: center;
                    border: 2px solid #ff5843;
                    border-radius: 8px;
                    padding: 20px;
                    margin-bottom: 20px;
                    background-color: #fff8e1;

            
                }
                .hobby-card h3 {
                    color: #ff5843;
                }

            </style>
        </head>
        <body>
            <h1>My Hobby Cards</h1>
            <div class="container">
                <div class="row">
                    <div class="col-12 col-md-6 col-lg-4">
                    <div class=" hobby-card">
                        <h3>Swimming</h3>
                        <p>I play swimming with my cousins almost every Saturday!</p>

</div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="hobby-card">
                            <h3>Football</h3>
                            <p>I watch football and I play football with my dad.</p>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="hobby-card">
                            <h3>Video Games</h3>
                            <p>I play a lot of video games in my free time and I enjoy them</p>
                        
                        </div>
                    </div>
                </div>
            </div>

        </body>
    </html>
</DOCTYPE>
