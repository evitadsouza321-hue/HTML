<!DOCTYPE html>
<html>
    <head>
        <title>Navbar</title>
        <style>
         body {
            font-family: Arial;
            margin: 0;

         }  
         .topnav {
            overflow: hidden;
            background-color: #333;
         } 
        .topnav a {
            float: left;
            color: #1affa3;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        .topnav  a :hover {
            background-color: #ddd;
            color: black;
        }
        .topnav a.active {
            background-color: #ffe066;
            color: black;
        }
        
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#home">Home</a>
            <a class="#" href="#aboutUs">About Us</a>
            <a class="#" href="#gallery">Gallery</a>
            <a class="#" href="#contactUs">Contact Us</a>
        </div>
    </body>
</html>
