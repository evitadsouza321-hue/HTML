<!DOCTYPE html>
<html>
    <head>
        <title>DOM Examination</title>
        <style>
            .alert {
                color: limegreen;
                background: black;
                padding: 5px;
            }
        </style>
    </head>
    <body>
        <h1 id="heading">DOM Examination</h1>
        <p>Hello</p>
        <p>How are you?</p>
        <script>
            let div = document.createElement("div");
            div.id = "paragraph";
            div.className = "alert";
            div.innerHTML = "<p>Congrats! You have created a div!</p>";

            document.body.append(div);
            let heading = document.getElementById("heading");
            heading.innerHTML = "&#128512;"
            document.querySelector("p").innerHTML = "<strong>Good Job!</strong>"
            
        </script>
    </body>
</html>
