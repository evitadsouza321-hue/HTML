<!DOCTYPE html>
<html>
    <head>>
        <title>Odd or Even Numbers</title>
        </head>
        <body>
            <script>
                function oddOrEvenNumbers(number){
                    if (number % 2 == 0)
                {
                    document.write(`The number ${number} is an even number.`)
                }
                else
                {
                    document.write(`The number ${number} is an odd number.`)
                }
            

                    
                }
                let evenorodd = prompt("Enter any number to verify if it is odd or even.");
                oddOrEvenNumbers(evenorodd);
            </script>
        </body>
</html>
