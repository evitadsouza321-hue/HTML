<!DOCTYPE html>
<html>
    <head>
        <title>Changing the color of the text using CSS propertiesCSS properties</title>
        <style>
            #myElement {
                border: 1px solid #CCC;
                width: 100px;
                height: 100px;

            }
        </style>
    </head>
    <body>
        <h2>Change Font Color of HTML Element in JavaScript</h2>
        <div id="myElement">Hello World!</div>
        <br>
        <button type="button" onclick="changeStyle()">Click Me</button>
        <script>
            function changeStyle() {
            var element = document.getElementById("myElement");
            element.style.color = "#FF0000";
            }
        </script>
    </body>
</html>
