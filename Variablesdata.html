<!DOCTYPE html>
<html>
    <head>
        <title>Variables and Data Types</title>
    </head>
    <body>
        <h2>Welcome to the world of Javascript.</h2>
        <script>
            let name = "Eyan Dsouza";
            let grade = 5;
            let favouriteSubject = "Mathematics";
            console.log(`My name is ${name} and I am in Grade ${grade}. My favourite subject is ${favouriteSubject}.`) 
            // `Today I learnt about how to use variables and comments and punctuations in Javascript. `
            // `I also learnt about the script tag and some data types in Javascript.It has a lot to offer and learn and I am excited to learn more baout it. `
            let student = { name: "Eyan Dsouza", grade: 5, hobby: "Football"};
            console.log(`My name is ${student.name} and I am in Grade ${student.grade}.My hobby is ${student.hobby}.`) 
        </script>
    </body>
</html>
